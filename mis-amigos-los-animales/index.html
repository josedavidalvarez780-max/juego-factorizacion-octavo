<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff8ef"><title>Mis amigos los animales</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:linear-gradient(#fff8ef,#eefaff);color:#24343b;user-select:none;-webkit-tap-highlight-color:transparent}.app{max-width:1000px;margin:auto;padding:12px}h1{text-align:center;font-size:clamp(1.7rem,7vw,3rem);margin:10px 45px 4px}.sub{text-align:center;margin:0 0 12px;font-weight:700;color:#566}.x{position:fixed;z-index:30;right:12px;top:12px;border:0;border-radius:50%;width:42px;height:42px;background:#fff;box-shadow:0 3px 12px #0003;font-size:1.6rem}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.grid.lock{pointer-events:none;opacity:.6}.card{border:0;border-radius:22px;overflow:hidden;background:#fff;box-shadow:0 7px 20px #0002;padding:0}.card img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}.nm{font-size:1.15rem;font-weight:900;padding:11px}.focus{position:fixed;z-index:20;inset:0;background:#fff8eff7;display:none;align-items:center;justify-content:center;padding:58px 16px 22px}.focus.show{display:flex}.fc{width:min(94vw,760px);background:#fff;border-radius:30px;overflow:hidden;box-shadow:0 20px 60px #0004;transform:scale(.7);opacity:0;transition:.3s}.focus.show .fc{transform:scale(1);opacity:1}.focus.shrink .fc{transform:scale(.25);opacity:0}.focus img{width:100%;height:min(62vh,560px);object-fit:contain;background:#edf2ef}.fn{text-align:center;font-weight:950;font-size:clamp(2.4rem,11vw,5rem);padding:14px;background:linear-gradient(135deg,#fff0ad,#ffdfe7)}.modal{position:fixed;z-index:40;inset:0;background:#13242a99;display:none;align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}.box{width:min(94vw,440px);background:#fff;border-radius:25px;padding:22px;text-align:center}.math{font-size:2rem;font-weight:950}.ans{width:100%;height:58px;border:2px solid #ccd8dc;border-radius:15px;text-align:center;font-size:1.8rem}.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:13px 0}.keys button,.act{border:0;border-radius:14px;min-height:54px;font-size:1.2rem;font-weight:900}.keys button{background:#eef4f6}.act{padding:12px 18px;background:#2d7a86;color:#fff}.gray{background:#e9edef;color:#24343b}@media(min-width:650px){.grid{grid-template-columns:repeat(3,1fr)}}@media(min-width:950px){.grid{grid-template-columns:repeat(4,1fr)}}
</style></head><body><main class="app"><button class="x" id="exit">×</button><h1>MIS AMIGOS LOS ANIMALES</h1><p class="sub">Toca un animal, míralo y escucha su sonido</p><section class="grid" id="grid"></section></main><audio id="audio" preload="none"></audio><div class="focus" id="focus"><div class="fc"><img id="big"><div class="fn" id="bigName"></div></div></div><div class="modal" id="adult"><div class="box"><h2>Solo los adultos pueden salir</h2><p>Resuelve la operación.</p><div class="math" id="problem"></div><input class="ans" id="ans" readonly><div class="keys" id="keys"></div><p id="err"></p><button class="act" id="check">Comprobar</button> <button class="act gray" id="cancel">Cancelar</button></div></div>
<script>
const A=[
["PERRO","https://commons.wikimedia.org/wiki/Special:Redirect/file/Canis_familiaris.jpg","https://commons.wikimedia.org/wiki/Special:Redirect/file/George_vuf_1996.ogg"],
["GATO","https://commons.wikimedia.org/wiki/Special:Redirect/file/Domesticcalicocat.jpg","https://commons.wikimedia.org/wiki/Special:Redirect/file/Meow.ogg"],
["VACA","https://commons.wikimedia.org/wiki/Special:Redirect/file/Common_Cow.jpg","https://commons.wikimedia.org/wiki/Special:Redirect/file/Mudchute_cow_1.ogg"],
["CABALLO","https://commons.wikimedia.org/wiki/Special:Redirect/file/Horse_in_a_pen.jpg","https://commons.wikimedia.org/wiki/Special:Redirect/file/Wiehern.ogg"],
["GALLINA","https://commons.wikimedia.org/wiki/Special:Redirect/file/Free_Range_Chicken.jpg","https://commons.wikimedia.org/wiki/Special:Redirect/file/Chickens_demanding_food.ogg"],
["GALLO","https://commons.wikimedia.org/wiki/Special:Redirect/file/A_rooster.jpg","https://commons.wikimedia.org/wiki/Special:Redirect/file/Rooster_crowing.ogg"],
["PATO","https://commons.wikimedia.org/wiki/Special:Redirect/file/Walking_duck.jpg","https://commons.wikimedia.org/wiki/Special:Redirect/file/Tufted_Duck.ogg"],
["OVEJA","https://commons.wikimedia.org/wiki/Special:Redirect/file/Sheep_in_a_pen.jpg","https://commons.wikimedia.org/wiki/Special:Redirect/file/Mudchute_sheep_1.ogg"],
["CABRA","https://commons.wikimedia.org/wiki/Special:Redirect/file/GOAT_and_grass.jpg","https://commons.wikimedia.org/wiki/Special:Redirect/file/Herd_of_goats_bleating.ogg"],
["CERDO","https://commons.wikimedia.org/wiki/Special:Redirect/file/Farm_Pigs_Feeding.jpg","https://commons.wikimedia.org/wiki/Special:Redirect/file/Mudchute_pig_3.ogg"],
["CONEJO","https://commons.wikimedia.org/wiki/Special:Redirect/file/A_white_rabbit.jpg","https://commons.wikimedia.org/wiki/Special:Redirect/file/Rabbit_oinks_and_squeaks.wav"],
["BURRO","https://commons.wikimedia.org/wiki/Special:Redirect/file/Donkey_pair.jpg","https://commons.wikimedia.org/wiki/Special:Redirect/file/157763_felix-blume_a-donkey-is-braying-in-his-enclosure-in-south-of-france.wav"]];
const g=document.getElementById("grid"),f=document.getElementById("focus"),b=document.getElementById("big"),bn=document.getElementById("bigName"),au=document.getElementById("audio");let locked=false,t;
function stop(){try{au.pause();au.currentTime=0}catch(e){}}
function closeFocus(){f.classList.add("shrink");setTimeout(()=>{f.classList.remove("show","shrink");g.classList.remove("lock");locked=false},300)}
function play(a){if(locked)return;locked=true;g.classList.add("lock");b.src=a[1];b.alt="Fotografía real de "+a[0].toLowerCase();bn.textContent=a[0];f.classList.add("show");stop();au.src=a[2];au.play().catch(()=>{});clearTimeout(t);t=setTimeout(()=>{stop();closeFocus()},10000)}
A.forEach(a=>{const c=document.createElement("button");c.className="card";c.innerHTML='<img loading="lazy" alt="Fotografía real de '+a[0].toLowerCase()+'" src="'+a[1]+'"><div class="nm">'+a[0]+'</div>';c.onclick=()=>play(a);g.append(c)});
const m=document.getElementById("adult"),p=document.getElementById("problem"),ans=document.getElementById("ans"),err=document.getElementById("err");let ex=0;function show(){let x=1+Math.floor(Math.random()*10),y=1+Math.floor(Math.random()*10);while(x+y>20)y=1+Math.floor(Math.random()*10);ex=x+y;p.textContent=x+" + "+y+" = ?";ans.value="";err.textContent="";m.classList.add("show")}
document.getElementById("exit").onclick=()=>{stop();show()};["1","2","3","4","5","6","7","8","9","←","0","C"].forEach(k=>{const z=document.createElement("button");z.textContent=k;z.onclick=()=>{if(k==="←")ans.value=ans.value.slice(0,-1);else if(k==="C")ans.value="";else if(ans.value.length<2)ans.value+=k};document.getElementById("keys").append(z)});document.getElementById("cancel").onclick=()=>m.classList.remove("show");document.getElementById("check").onclick=()=>{if(Number(ans.value)===ex){m.classList.remove("show");if(confirm("¿Deseas salir del juego?")){try{window.close()}catch(e){}setTimeout(()=>alert("Si la pestaña no se cerró, ciérrala manualmente desde el navegador."),250)}}else{err.textContent="Respuesta incorrecta."}}
</script></body></html>
